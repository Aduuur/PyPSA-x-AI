# Scenario (role 4), with border trade (role 3). Differs from `trade-cable` in the cable cost only (role 1's high level).
# Layer it on the workshop config and border-trade.yaml, in this order (the
# last file sets the run name). See workshop/economics/STUDY_DESIGN.md.
#
#   sh workshop/economics/link_inputs.sh trade-cable-cost-high
#   pixi run snakemake results/trade-cable-cost-high/networks/solved_2050.nc -c4 \
#     --configfile config/config.workshop.yaml config/workshop/border-trade.yaml \
#     config/workshop/trade-cable-cost-high.yaml \
#     --allowed-rules process_cost_data compose_network solve_network

run:
  name: trade-cable-cost-high

brazil_cable:              # read by workshop/cable/add_brazil_cable.py (role 1)
  enable: true
  level: high   # role 1's low | central | high
