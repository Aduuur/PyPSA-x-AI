# Scenario (role 4), with border trade (role 3). Differs from `trade-cap2050-relaxed` in the cable only (role 1's central level).
# Layer it on the workshop config and border-trade.yaml, in this order (the
# last file sets the run name). See workshop/economics/STUDY_DESIGN.md.
#
#   sh workshop/economics/link_inputs.sh trade-cable-cap2050-relaxed
#   pixi run snakemake results/trade-cable-cap2050-relaxed/networks/solved_2050.nc -c4 \
#     --configfile config/config.workshop.yaml config/workshop/border-trade.yaml \
#     config/workshop/trade-cable-cap2050-relaxed.yaml \
#     --allowed-rules process_cost_data compose_network solve_network

run:
  name: trade-cable-cap2050-relaxed

brazil_cable:              # read by workshop/cable/add_brazil_cable.py (role 1)
  enable: true
  level: central   # role 1's low | central | high
co2_budget:
  upper:
    2050: 0.02             # as in cap2050-relaxed.yaml (placeholder, to agree with role 3)
