# Scenario (role 4): cable with the relaxed 2050 cap.
# Differs from `cable` in 2050 cap. See workshop/economics/STUDY_DESIGN.md.
#
#   sh workshop/economics/link_inputs.sh cable-cap2050-relaxed
#   pixi run snakemake results/cable-cap2050-relaxed/networks/solved_2050.nc -c4 \
#     --configfile config/config.workshop.yaml config/workshop/cable-cap2050-relaxed.yaml \
#     --allowed-rules process_cost_data compose_network solve_network
#
# Needs the cable and Brazil in compose_network (roles 1, 2, 3), reading the
# workshop_cable block below. Until then this run equals the baseline.

run:
  name: cable-cap2050-relaxed

workshop_cable:
  enable: true
  parameters: workshop/cable/cable_parameters.yaml   # role 1, generated by cable_cost.py
  level: central   # low | central | high (role 1's levels)
  route: reference   # case in role 1's routes
  financing: project   # project: WACC and IDC per asset from financing.py at runtime
                       # harmonised: the model's default discount rate
co2_budget:
  upper:
    2050: 0.02             # as in cap2050-relaxed.yaml
