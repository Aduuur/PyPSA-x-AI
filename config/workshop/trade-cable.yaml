# Scenario (role 4), with border trade (role 3). Differs from `de10-trade` in the cable only (role 1's central level).
# Layer it on the workshop config and border-trade.yaml, in this order (the
# last file sets the run name). See workshop/economics/STUDY_DESIGN.md.
#
#   sh workshop/economics/link_inputs.sh trade-cable
#   pixi run snakemake results/trade-cable/networks/solved_2050.nc -c4 \
#     --configfile config/config.workshop.yaml config/workshop/border-trade.yaml \
#     config/workshop/trade-cable.yaml \
#     --allowed-rules process_cost_data compose_network solve_network

run:
  name: trade-cable

brazil_cable:              # read by workshop/cable/add_brazil_cable.py (role 1)
  enable: true
  level: central   # role 1's low | central | high
brazil_supply:             # read by workshop/brazil/add_brazil_supply.py (role 2);
  enable: true             # without it the cable has no power to carry
