# Sensitivity (role 4): the CO2 cap in 2050 at 2% of 1990 power-sector
# emissions instead of zero. Only 2050 changes; every other horizon keeps
# the baseline cap. Layer it on the workshop config (and, for the run with
# the cable, on the cable config):
#
#   sh workshop/economics/link_inputs.sh cap2050-relaxed
#   pixi run snakemake results/cap2050-relaxed/networks/solved_2050.nc -c4 \
#     --configfile config/config.workshop.yaml config/workshop/cap2050-relaxed.yaml \
#     --allowed-rules process_cost_data compose_network solve_network
#
# Placeholder value for the level, to be agreed with role 3.

run:
  name: cap2050-relaxed

co2_budget:
  upper:
    2050: 0.02
