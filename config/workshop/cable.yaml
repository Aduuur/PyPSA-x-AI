# Scenario (role 4): main case, role 1's central cable.
# Differs from `de10-myopic` in the cable only. See workshop/economics/STUDY_DESIGN.md.
#
#   sh workshop/economics/link_inputs.sh cable
#   pixi run snakemake results/cable/networks/solved_2050.nc -c4 \
#     --configfile config/config.workshop.yaml config/workshop/cable.yaml \
#     --allowed-rules process_cost_data compose_network solve_network
#
# The cable is in compose_network (role 1). It carries power only once role 2
# has added the bus `Brazil Natal` with Brazilian supply.

run:
  name: cable

brazil_cable:              # read by workshop/cable/add_brazil_cable.py (role 1)
  enable: true
  level: central   # role 1's low | central | high
