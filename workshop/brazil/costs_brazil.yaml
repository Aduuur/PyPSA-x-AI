# Brazilian generation costs (role 2), public sources only. Read at runtime by
# workshop/brazil/add_brazil_supply.py. Cost basis agreed with role 4
# (workshop/economics/STUDY_DESIGN.md): EUR 2025, ECB annual mean 2025, IPCA,
# lifetimes and discount rate of the cost data, same definition as the cost
# data (overnight investment without grid connection beyond the plant).

source:
  name: "EPE, PDE 2035, Caderno de Parametros de Custos de Geracao e Transmissao (rev. 10.11.2025), CAPEX table, p. 11"
  url: "https://www.epe.gov.br/pt/publicacoes-dados-abertos/publicacoes/plano-decenal-de-expansao-de-energia-2035"
  basis: "BRL of December 2024; CAPEX incl. grid connection, without interest during construction; O&M fixed and variable"
  sample: "Brazilian projects (generation auctions) and international references"
  previous: "EPE Power Generation Costs Report 2021 (BRL Dec 2020); replaced, it gives nearly the same wind cost in EUR 2025"

# EPE's CAPEX reference levels (CAPEX Referencia, sem JDC, BRL/kW) and O&M (BRL/kW/a)
technologies:
  onwind:
    capex_levels_brl_per_kw: [5000, 5500, 6200, 7000]
    om_brl_per_kw_year: 110
    grid_connection_share: 0.10   # EPE 2021 report, Fig. 7: grid connection about 10 % of CAPEX
  solar-hsat:
    capex_levels_brl_per_kw: [3000, 3500, 4500, 5500]   # EPE: does not split fixed and tracking
    om_brl_per_kw_year: 60
    grid_connection_share: 0.10   # EPE 2021 report, Fig. 18

conversion:
  # IPCA (Banco Central do Brasil, SGS series 433, monthly), Dec 2024 level ->
  # mean level of 2025: product of the monthly rates Jan 2025 to the month,
  # averaged over the 12 months of 2025. Retrieved 2026-11-27.
  ipca_to_2025: 1.0282
  # ECB reference rate BRL per EUR, annual mean 2025 (series EXR.A.BRL.EUR.SP00.A).
  # Retrieved 2026-11-27.
  brl_per_eur_2025: 6.3072

# Later horizons: the Brazilian 2025 level follows the relative change of the
# same technology in the cost data (cost-data technology, its 2025 value as base).
learning:
  reference_technology: {onwind: onwind, solar-hsat: solar-utility single-axis tracking}
  base_year: 2025

# low: lowest EPE level; central: mean of the levels; high: highest level.
levels: [low, central, high]
